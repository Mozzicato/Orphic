[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orphic"
version = "0.0.1"
description = "Local-first filesystem intelligence engine: index storage, find duplicates provably, propose safe cleanup."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Mubarak Salaudeen" }]
dependencies = ["typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
orphic = "orphic.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["orphic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
strict = true
files = ["src"]
